baseURL = 'https://duonyx.github.io/hugo-bootstrap-theme/'
title = "Duonyx"
author = "Ludovic Piot"
copyright = "Open-source <a class=\"text-muted text-decoration-none\" href=\"https://github.com/filipecarneiro/hugo-bootstrap-theme/blob/main/LICENSE\">MIT</a> Licensed."

timeZone = 'Europe/Paris'

# Multilingual
defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = false

theme = "hugo-bootstrap-theme"
themesdir = "themes"

disableHugoGeneratorInject = true
enableRobotsTXT = true
#enableGitInfo = true
enableEmoji = true
#sectionPagesMenu = "main"
#googleAnalytics = "UA-1511XXXX-X"

[frontmatter]
  date = ["date", "publishDate", "lastmod"]
  lastmod = ["lastmod", ":fileModTime", ":default"]

[taxonomies]
  author    = "authors"
  category  = "categories"
  community = "communities"
  feature   = "features"
  series    = "series"
  solution  = "solutions"
  tag       = "tags"

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[permalinks]
#  post = "/post/:title/"

[module]
  [module.hugoVersion]
    extended = true
    min = "0.99.1"
    max = ""
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
